<script>
(()=>{
'use strict';
const STORE='plantao360_config_v1';
const week=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

const dayMs=86400000;
const $=(q,root=document)=>root.querySelector(q);
const htmlEscape=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const toKey=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function dateObj(key){const [y,m,d]=String(key).split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function epochDay(key){return Math.floor(dateObj(key).getTime()/dayMs)}
function shiftDay(key,diff){const d=new Date(dateObj(key).getTime()+diff*dayMs);return toKey(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}

const prettyShort=key=>{const [y,m,d]=key.split('-').map(Number);return `${d} ${shortMonths[m-1]} ${y}`};

function exportPersonal(id){const events=id?cfg.personal.filter(e=>e.id===id):cfg.personal;if(!events.length){message('Nenhum evento pessoal para exportar.');return;}const esc=v=>String(v).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const fmt=d=>`${toKey(d.getFullYear(),d.getMonth()+1,d.getDate()).replace(/-/g,'')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;const out=['BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','PRODID:-//Plantao 360//Eventos pessoais//PT-BR','X-WR-CALNAME:Plantão 360 - Eventos'];for(const e of events){const start=localEventTime(e),end=new Date(start.getTime()+3600000);out.push('BEGIN:VEVENT',`UID:${e.id}@plantao360.local`,`DTSTAMP:${stamp}`,`SEQUENCE:${e.revision}`,`DTSTART:${fmt(start)}`,`DTEND:${fmt(end)}`,`SUMMARY:${esc(e.name)}`,`DESCRIPTION:${esc(e.notes)}`);if(e.reminder>=0)out.push('BEGIN:VALARM',`TRIGGER:${e.reminder===0?'PT0M':'-PT'+e.reminder+'M'}`,'ACTION:DISPLAY',`DESCRIPTION:${esc(e.name)}`,'END:VALARM');out.push('END:VEVENT');}out.push('END:VCALENDAR');const encoder=new TextEncoder();const fold=line=>{let parts=[],part='',limit=75;for(const ch of line){if(encoder.encode(part+ch).length>limit){parts.push(part);part=' ';limit=75;}part+=ch;}parts.push(part);return parts.join('\r\n');};download(id?'plantao360-evento.ics':'plantao360-eventos.ics',out.map(fold).join('\r\n')+'\r\n','text/calendar;charset=utf-8');message('Arquivo criado. Importe no calendário do celular e confirme o alerta.');}

function persist(){try{localStorage.setItem(STORE,JSON.stringify(cfg))}catch{message('Não foi possível salvar. Confira o armazenamento do navegador.')}}
function baseShift(key){return !!cfg.anchor&&((epochDay(key)-epochDay(cfg.anchor))%3+3)%3===0}

}

function updateHero(){const title=$('#hero-title'),sub=$('#hero-sub'),num=$('#hero-number'),label=$('#hero-count-label');if(!cfg.anchor){title.textContent='Sua rotina organizada.';sub.textContent='Configure a data de um plantão conhecido para gerar toda a escala.';num.textContent='12×60';num.style.fontSize='21px';label.textContent='PRONTO PARA CONFIGURAR';return}const nxt=nextShiftKey();if(!nxt){title.textContent='Escala sem plantão futuro';sub.textContent='Confira suas trocas de plantão.';num.textContent='—';label.textContent='PRÓXIMO PLANTÃO';return}let days=epochDay(nxt)-epochDay(todayKey());num.style.fontSize='32px';num.textContent=days===0?'Hoje':`${days}d`;label.textContent='PRÓXIMO PLANTÃO';title.textContent=cfg.kind==='night'?'Plantões noturnos':'Plantões diurnos';sub.textContent=`Próximo: ${prettyShort(nxt)} · ${cfg.start} às ${fmtEnd(cfg.start)} · ${movedTo(nxt)?'Plantão por troca':'Ciclo de 72 horas'}.`}

function detail(key){

function eventList(y,m){let list=eventsFor(y).filter(x=>Number(x.date.slice(5,7))===m);if(!list.length)return '<p class="empty-text">Nenhuma data especial registrada neste mês.</p>';return list.map(ev=>{const d=Number(ev.date.slice(-2));const tags={national:'Feriado',optional:'Facultativo*',special:'Comemorativa',local:'Local',custom:'Personalizada',personal:'Evento'},source=movedFrom(ev.date),target=movedTo(ev.date);const context=source?`Plantão trocado para ${prettyShort(source.to)}`:target?`Plantão recebido por troca de ${prettyShort(target.from)}`:isShift(ev.date)?`Coincide com plantão ${cfg.kind==='night'?'noturno':'diurno'}`:isTail(ev.date)?'Após plantão noturno':cfg.anchor?'Dia sem início de plantão':'Configure sua escala';return `<div class="event-row"><div class="event-date ${ev.type==='personal'?'personal':''}">${d}<span>${shortMonths[m-1]}</span></div><div class="event-copy"><strong>${htmlEscape(ev.name)}</strong><small>${ev.type==='personal'?`${ev.time} · ${reminderLabel(ev.reminder)} · `:''}${context}</small></div><span class="event-tag ${ev.type==='personal'?'personal':ev.type==='national'?'':'optional'}">${tags[ev.type]||'Especial'}</span></div>`}).join('')}
function renderCalendar(){const y=shown.getFullYear(),m=shown.getMonth()+1,navName=`${months[m-1]} ${y}`,n=monthCount(y,m);let opt=!cfg.anchor?'<div class="info-stripe"><strong>Comece aqui:</strong> toque em <b>Minha escala</b> e informe um dia em que você trabalhou (ou vai trabalhar). O aplicativo marcará todo o ciclo 12×60, inclusive feriados.</div>':'';return opt+`<section class="card"><div class="eyebrow">SEU CALENDÁRIO</div><div class="toolbar"><button class="toolbtn" data-move="-1" aria-label="Mês anterior">‹</button><div style="text-align:center"><h2>${navName}</h2><small>${cfg.anchor?`${n} inícios de plantão neste mês`:'Feriados e datas importantes'}</small></div><button class="toolbtn" data-move="1" aria-label="Próximo mês">›</button></div><div class="calendar-head">${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-grid">${calendar(y,m)}</div><div class="legend"><span><i class="dot"></i>Plantão diurno</span><span><i class="dot night"></i>Noturno</span><span><i class="dot tail"></i>Saída após meia-noite</span><span><i class="dot swap-target"></i>Plantão por troca</span><span><i class="dot swap-source"></i>Trocado (original)</span><span><i class="dot holiday"></i>Feriado</span><span><i class="dot personal"></i>Evento pessoal</span><span><i class="dot today"></i>Hoje</span></div>${detail(selected)}<div class="small-buttonbar"><button class="outline" data-today="1">Ir para hoje</button><button class="outline" data-nav="scale">${cfg.anchor?'Editar escala':'Configurar escala'}</button></div></section><section class="card"><div class="card-head"><div><div class="eyebrow">DATAS IMPORTANTES</div><h2>Feriados e eventos</h2></div><span class="pill neutral">${months[m-1].slice(0,3)}</span></div>${eventList(y,m)}<p class="small-muted">*Pontos facultativos variam conforme instituição e ano. Feriados estaduais e municipais podem ser cadastrados em Ajustes.</p></section>`}
function renderScale(){const anchor=cfg.anchor||todayKey();return `<section class="card"><div class="eyebrow">CONFIGURAÇÃO</div><h2>Minha escala 12×60</h2><p class="small-muted">São 12 horas de trabalho seguidas por 60 horas de folga. Um novo plantão começa exatamente 72 horas após o anterior — mesmo em sábados, domingos e feriados.</p><form id="scale-form"><div class="field"><span class="field-label">Tipo de plantão</span><div class="segmented"><button type="button" class="segment ${cfg.kind==='day'?'active':''}" data-kind="day">☀️ Diurno</button><button type="button" class="segment night ${cfg.kind==='night'?'active':''}" data-kind="night">🌙 Noturno</button></div></div><div class="grid-form"><div class="field"><label for="anchor">Data de um plantão conhecido</label><input id="anchor" name="anchor" type="date" required value="${anchor}"></div><div class="field"><label for="start">Horário em que começa</label><input id="start" name="start" type="time" required value="${cfg.start}"></div></div><p class="section-help">Você pode informar qualquer plantão, passado ou futuro. O aplicativo calcula os demais para frente e para trás; não precisa ser o primeiro plantão da sua carreira.</p><button type="submit" class="primary full">✓ Salvar e gerar calendário</button></form></section><div class="card"><div class="card-head"><div><div class="eyebrow">SUA ROTINA</div><h2>Resumo da escala</h2></div>${cfg.anchor?`<span class="pill ${cfg.kind==='night'?'night':''}">${cfg.kind==='night'?'Noturno':'Diurno'}</span>`:'<span class="pill neutral">Não definida</span>'}</div>${cfg.anchor?`<p class="small-muted">Referência: <b>${prettyShort(cfg.anchor)}</b> · ${cfg.start} às ${fmtEnd(cfg.start)}${crossesMidnight()?' do dia seguinte':''}.</p><div class="stat-row"><div class="stat"><b>12h</b><small>Trabalho</small></div><div class="stat"><b>60h</b><small>Folga</small></div><div class="stat"><b>72h</b><small>Ciclo</small></div></div><div class="small-buttonbar"><button class="outline" data-nav="calendar">Ver mês</button><button class="outline" data-export="ics">Enviar ao Calendário</button></div>`:'<p class="empty-text">Salve uma data e um horário para visualizar a escala.</p>'}</div><div class="notice">💡 <b>Plantão noturno:</b> o dia de início recebe o destaque principal. O dia seguinte, quando houver saída pela manhã, aparece em lilás claro. Isso evita confundir o término de um plantão com o início de outro.</div>`}
function renderYear(){const y=yearShown;let html=`<section class="card"><div class="eyebrow">VISÃO GERAL</div><h2>Calendário anual</h2><p class="small-muted">Toque em um mês para ver detalhes, feriados e dias de plantão.</p><div class="year-nav"><button class="toolbtn" data-year="-1" aria-label="Ano anterior">‹</button><strong>${y}</strong><button class="toolbtn" data-year="1" aria-label="Próximo ano">›</button></div><div class="year-grid">`;for(let m=1;m<=12;m++)html+=`<button class="year-tile" data-month="${m}"><h3>${months[m-1]} <small style="float:right;color:#8a9ab1">${cfg.anchor?monthCount(y,m)+' P':''}</small></h3><div class="minigrid">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="mini-week">${x}</span>`).join('')}${calendar(y,m,true)}</div></button>`;return html+'</div></section><div class="notice">Azul e roxo indicam plantões da escala; laranja indica plantão por troca. A data original fica bege e discreta, marcada como TROCADO no calendário mensal. Feriados continuam identificados. A marca verde indica evento pessoal.</div>'}
function renderSettings(){return `<section class="card"><div class="eyebrow">PERSONALIZAÇÃO</div><h2>Ajustes do calendário</h2><div class="switch"><label for="optional">Mostrar pontos facultativos usuais</label><input type="checkbox" id="optional" data-opt="showOptional" ${cfg.showOptional?'checked':''}></div><div class="switch"><label for="special">Mostrar datas comemorativas</label><input type="checkbox" id="special" data-opt="showSpecial" ${cfg.showSpecial?'checked':''}></div><p class="small-muted">Os dez feriados nacionais são exibidos sempre. Pontos facultativos não são necessariamente feriados, e regras locais podem variar.</p></section><section class="card"><div class="eyebrow">FERIADOS LOCAIS</div><h2>Adicionar data especial</h2><p class="small-muted">Registre um feriado municipal, estadual ou uma data importante para você.</p><form id="custom-form"><div class="field"><label for="custom-label">Nome da data</label><input name="label" id="custom-label" type="text" maxlength="70" placeholder="Ex.: Aniversário da cidade" required></div><div class="grid-form"><div class="field"><label for="custom-date">Data</label><input type="date" id="custom-date" name="date" value="${todayKey()}" required></div><div class="field"><label for="custom-kind">Categoria</label><select name="category" id="custom-kind"><option value="local">Feriado local</option><option value="custom">Data especial</option></select></div></div><label class="inline-check"><input type="checkbox" name="yearly" checked> Repetir todos os anos</label><button type="submit" class="primary full">+ Adicionar ao calendário</button></form>${cfg.custom.length?`<div style="margin-top:15px">${cfg.custom.map((c,i)=>`<div class="custom-item"><div><strong>${htmlEscape(c.name)}</strong><small>${prettyShort(c.date)} · ${c.yearly?'Todo ano':'Somente nesta data'}</small></div><button class="delete" data-delete="${i}">Excluir</button></div>`).join('')}</div>`:''}</section><section class="card"><div class="eyebrow">ALTERAÇÕES PONTUAIS</div><h2>Trocas de plantão</h2><p class="small-muted">As trocas não alteram o ciclo 12×60. Você pode desfazer qualquer uma e recuperar imediatamente as datas originais.</p>${cfg.swaps.length?`<div class="swap-list">${[...cfg.swaps].sort((a,b)=>a.from.localeCompare(b.from)).map(x=>`<div class="swap-entry"><span><strong>${prettyShort(x.from)}</strong> (TROCADO)<br>→ <b>${prettyShort(x.to)}</b> (plantão em laranja)${x.note?`<br>${htmlEscape(x.note)}`:''}</span><button class="outline alt" data-undo-swap="${x.from}">Desfazer</button></div>`).join('')}</div>`:'<p class="empty-text">Nenhuma troca registrada. Para alterar um plantão, toque no dia azul ou roxo no calendário.</p>'}</section><section class="card"><div class="eyebrow">SEUS DADOS</div><h2>Backup e Calendário</h2><p class="small-muted">A escala é salva neste navegador. Faça um backup para recuperar sua configuração em outro iPhone.</p><div class="small-buttonbar"><button class="outline" data-export="json">Exportar backup</button><button class="outline" data-import="json">Importar backup</button></div><div class="small-buttonbar"><button class="outline" data-export="ics" ${cfg.anchor?'':'disabled'}>📅 Exportar próximos 12 meses (.ics)</button></div><div class="small-buttonbar"><button class="outline" data-export="personal" ${cfg.personal.length?'':'disabled'}>📌 Exportar eventos pessoais (.ics)</button></div><p class="small-muted">Os eventos exportados não são sincronizados automaticamente. Após editar ou excluir um evento aqui, atualize-o também no calendário do celular.</p><input id="backup-file" type="file" accept="application/json,.json" style="display:none"><p class="small-muted">O arquivo .ics respeita as trocas registradas e inclui somente os plantões vigentes. Se você já importou uma versão anterior, remova os eventos antigos do Calendário antes de importar a nova, para evitar duplicatas.</p></section><div class="notice">🔒 Nenhuma conta é necessária. Seus dados ficam armazenados apenas no aparelho; não são enviados a um servidor. Para sincronizar entre celulares futuramente, poderemos adicionar login e nuvem.</div><div class="footer">Plantão 360 • Versão para iPhone<br>Feriados conforme calendário nacional brasileiro; confirme feriados locais e pontos facultativos com seu empregador.</div>`}
function render(){updateHero();updateReminders();const views={calendar:renderCalendar,scale:renderScale,year:renderYear,settings:renderSettings};$('#main-content').innerHTML=views[tab]();document.querySelectorAll('[data-nav]').forEach(b=>{if(b.classList.contains('nav-btn'))b.classList.toggle('active',b.dataset.nav===tab)})}
function message(s){const el=$('#toast');el.textContent=s;el.classList.remove('hide');clearTimeout(message.t);message.t=setTimeout(()=>el.classList.add('hide'),2800)}
function showTab(t){editingEvent=null;tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportIcs(){
 if(!cfg.anchor){message('Configure sua escala antes de exportar.');return}
 const first=todayKey(),startWindow=epochDay(first),endWindow=epochDay(shiftDay(first,365));
 const startHour=cfg.start.replace(':',''),finish=fmtEnd(cfg.start).replace(':',''),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const out=['BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','METHOD:PUBLISH','PRODID:-//Plantao 360//Plantao 12x60//PT-BR','X-WR-CALNAME:Meus Plantões 12x60'];let count=0;
 const icsEscape=v=>String(v).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
 for(let day=startWindow;day<=endWindow;day++){
  const date=shiftDay(first,day-startWindow);if(!isShift(date))continue;
  const to=movedTo(date),end=crossesMidnight()?shiftDay(date,1):date;
  const s=date.replace(/-/g,'')+'T'+startHour+'00',e=end.replace(/-/g,'')+'T'+finish+'00';count++;
  const desc=to?`Plantão transferido de ${prettyShort(to.from)} para ${prettyShort(date)}. ${to.note||''} Demais datas mantidas na escala 12x60.`:'12 horas de trabalho e 60 horas de folga. Horário local.';
  out.push('BEGIN:VEVENT',`UID:plantao360-${date.replace(/-/g,'')}-${cfg.kind}@local`,`DTSTAMP:${stamp}`,`DTSTART:${s}`,`DTEND:${e}`,`SUMMARY:${to?'Plantão por troca':'Plantão'} ${cfg.kind==='night'?'noturno':'diurno'} 12x60`,`DESCRIPTION:${icsEscape(desc)}`,'END:VEVENT');
 }
 out.push('END:VCALENDAR');download('meus-plantoes-12x60.ics',out.join('\r\n'),'text/calendar;charset=utf-8');message(`${count} plantões vigentes adicionados ao calendário (trocas incluídas).`);
}
function exportJson(){download('plantao360-backup.json',JSON.stringify({app:'Plantao360',version:3,exportedAt:new Date().toISOString(),settings:cfg},null,2),'application/json');message('Backup criado. Salve em Arquivos ou iCloud Drive.')}
function saveScale(form){const fd=new FormData(form),anchor=String(fd.get('anchor')),start=String(fd.get('start'));if(!isValidKey(anchor)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)){message('Confira a data e o horário.');return}if(cfg.swaps.length&&cfg.anchor&&anchor!==cfg.anchor){if(!confirm('Alterar a data de referência muda a escala original. Isso removerá suas trocas pontuais atuais. Deseja continuar?'))return;cfg.swaps=[]}cfg.anchor=anchor;cfg.start=start;persist();const [y,m]=anchor.split('-').map(Number);shown=new Date(y,m-1,1);selected=anchor;yearShown=y;showTab('calendar');message('Escala 12×60 calculada com sucesso!')}
function saveCustom(form){const data=new FormData(form),name=String(data.get('label')||'').trim(),date=String(data.get('date')||''),category=String(data.get('category')||'local');if(!name||name.length>70||!isValidKey(date)||!['local','custom'].includes(category)){message('Preencha corretamente a data especial.');return}cfg.custom.push({name,date,type:category,yearly:data.get('yearly')==='on'});persist();render();message('Data adicionada!')}
function saveSwap(form){
 const fd=new FormData(form),from=String(fd.get('from')||''),to=String(fd.get('to')||''),note=String(fd.get('note')||'').trim();
 if(!cfg.anchor||!isValidKey(from)||!isValidKey(to)||from===to){message('Escolha uma data diferente e válida para a troca.');return}
 if(!baseShift(from)||movedFrom(from)||movedTo(from)){message('Escolha um plantão original ainda não alterado.');return}
 if(baseShift(to)||movedTo(to)||movedFrom(to)){message('A data de destino já faz parte da escala ou de outra troca. Escolha um dia livre.');return}
 if(note.length>100){message('Observação muito longa.');return}
 cfg.swaps.push({from,to,note});persist();selected=to;const [y,m]=to.split('-').map(Number);shown=new Date(y,m-1,1);yearShown=y;render();message('Troca salva! Data original TROCADO; nova data em laranja.');
}
function undoSwap(from){const i=cfg.swaps.findIndex(x=>x.from===from);if(i<0)return;const swap=cfg.swaps[i];if(!confirm(`Desfazer troca de ${prettyShort(swap.from)} para ${prettyShort(swap.to)}?`))return;cfg.swaps.splice(i,1);persist();selected=swap.from;const [y,m]=swap.from.split('-').map(Number);shown=new Date(y,m-1,1);render();message('Troca desfeita; escala original restaurada.');}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.newEvent){openEditor('');return}if(b.dataset.editEvent){openEditor(b.dataset.editEvent);return}if(b.dataset.cancelEvent){editingEvent=null;render();return}if(b.dataset.personalIcs){exportPersonal(b.dataset.personalIcs);return}if(b.dataset.removeEvent){if(confirm('Excluir este evento pessoal? Se exportado, exclua também no calendário do celular.')){cfg.personal=cfg.personal.filter(e=>e.id!==b.dataset.removeEvent);editingEvent=null;persist();render();message('Evento excluído.')}return}if(b.dataset.dismissEvent){const e=cfg.personal.find(x=>x.id===b.dataset.dismissEvent);if(e){e.dismissed=true;persist();updateReminders()}return}if(b.dataset.viewEvent){const e=cfg.personal.find(x=>x.id===b.dataset.viewEvent);if(e){selected=e.date;const [y,m]=e.date.split('-').map(Number);shown=new Date(y,m-1,1);yearShown=y;showTab('calendar');document.querySelector('.personal-card')?.scrollIntoView({behavior:'smooth'})}return}if(b.dataset.export==='personal'){exportPersonal();return}if(b.dataset.move||b.dataset.day||b.dataset.today||b.dataset.month||b.dataset.year||b.dataset.undoSwap)editingEvent=null;if(b.dataset.undoSwap){undoSwap(b.dataset.undoSwap);return}if(b.dataset.nav){showTab(b.dataset.nav);return}if(b.dataset.move){shown=new Date(shown.getFullYear(),shown.getMonth()+Number(b.dataset.move),1);selected=toKey(shown.getFullYear(),shown.getMonth()+1,1);render();return}if(b.dataset.day){selected=b.dataset.day;render();return}if(b.dataset.today){shown=new Date();selected=todayKey();render();return}if(b.dataset.year){yearShown=Math.max(1901,Math.min(2099,yearShown+Number(b.dataset.year)));render();return}if(b.dataset.month){shown=new Date(yearShown,Number(b.dataset.month)-1,1);selected=toKey(yearShown,Number(b.dataset.month),1);showTab('calendar');return}if(b.dataset.kind){if(cfg.kind!==b.dataset.kind){cfg.kind=b.dataset.kind;const time=$('#start');if(time&&(time.value==='07:00'||time.value==='19:00'))time.value=cfg.kind==='night'?'19:00':'07:00';const nextTime=time?.value;persist();render();if(nextTime&&$('#start'))$('#start').value=nextTime}return}if(b.dataset.delete!==undefined){const i=Number(b.dataset.delete);if(confirm('Excluir esta data especial do calendário?')){cfg.custom.splice(i,1);persist();render()}return}if(b.dataset.export==='ics')return exportIcs();if(b.dataset.export==='json')return exportJson();if(b.dataset.import)$('#backup-file').click()});
document.addEventListener('change',ev=>{if(ev.target.dataset.opt){cfg[ev.target.dataset.opt]=ev.target.checked;persist();render()};if(ev.target.id==='backup-file'){const file=ev.target.files?.[0];if(!file)return;file.text().then(t=>{try{const obj=JSON.parse(t);const x=obj.settings;if(obj.app!=='Plantao360'||!x||typeof x!=='object'||(x.anchor&&!isValidKey(x.anchor))||!['day','night'].includes(x.kind)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.start))throw Error();if(!confirm('Importar a configuração do backup e substituir a atual?'))return;cfg={...fallback,...x,custom:Array.isArray(x.custom)?x.custom:[],swaps:Array.isArray(x.swaps)?x.swaps.filter(z=>z&&isValidKey(z.from)&&isValidKey(z.to)&&z.from!==z.to&&typeof z.note!=='object'):[],personal:cleanPersonal(x.personal)};editingEvent=null;persist();render();message('Backup importado!')}catch{message('Este arquivo não é um backup válido do Plantão 360.')}}).finally(()=>{ev.target.value=''})}});
document.addEventListener('submit',ev=>{if(ev.target.id==='personal-form'){ev.preventDefault();savePersonal(ev.target)}else if(ev.target.id==='scale-form'){ev.preventDefault();saveScale(ev.target)}else if(ev.target.id==='custom-form'){ev.preventDefault();saveCustom(ev.target)}else if(ev.target.id==='swap-form'){ev.preventDefault();saveSwap(ev.target)}});
render();
setInterval(updateReminders,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateReminders()});window.addEventListener('focus',updateReminders);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});

})();
</script>
